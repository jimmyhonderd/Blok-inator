<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const cv=document.getElementById('c'), g=cv.getContext('2d');
const KEY='blok-inator-v1';
let store={}; try{ store=JSON.parse(localStorage.getItem(KEY))||{}; }catch(_){ store={}; }
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(store)); }catch(_){} };

/* ---------- neon palette ---------- */
const C={I:'#22e6ff',O:'#ffd100',T:'#ff2bd6',S:'#39ff6a',Z:'#ff3b4a',J:'#2f7bff',L:'#ff8a1f'};
const HUD_PINK='#ff2b7a', HUD_CYAN='#22e6ff', YEL='#ffd100', INK='#dff6ff', DIM='#0e1a2a', GRID='rgba(34,230,255,.10)';
const SHAPES={
  I:[[0,1],[1,1],[2,1],[3,1]], O:[[1,0],[2,0],[1,1],[2,1]], T:[[1,0],[0,1],[1,1],[2,1]],
  S:[[1,0],[2,0],[0,1],[1,1]], Z:[[0,0],[1,0],[1,1],[2,1]], J:[[0,0],[0,1],[1,1],[2,1]], L:[[2,0],[0,1],[1,1],[2,1]]
};
const KICKS={
  n:[[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]], // generic JLSTZ (0->R), signs handled by direction
  i:[[0,0],[-2,0],[1,0],[-2,-1],[1,2]]
};
const COLS=10, ROWS=20, HIDDEN=2;

/* ---------- state ---------- */
let W=0,H=0,DPR=1,land=false, cell=10, fx=0, fy=0; // field origin
let state='title', board, cur, hold=null, canHold=true, bag=[], nextQ=[], score=0, lines=0, level=1, best=store.best||0;
let dropT=0, lockT=0, lockDelay=500, flashRows=[], flashT=0, msgs=[], t_last=0, shake=0, tetrisT=0, btns=[];

function fit(){
  DPR=Math.min(2,devicePixelRatio||1);
  const vw=document.body.clientWidth, vh=document.body.clientHeight;
  W=vw; H=vh; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; g.setTransform(DPR,0,0,DPR,0,0);
  land = vw>vh*1.05;
  if(land){ cell=Math.floor(Math.min(vh*0.9/ROWS, vw*0.34/COLS)); fx=Math.round((vw-COLS*cell)/2); fy=Math.round((vh-ROWS*cell)/2); }
  else { const btnH=Math.min(110,vh*0.14); cell=Math.floor(Math.min((vh-btnH-70)/ROWS, vw*0.78/COLS)); fx=Math.round((vw-COLS*cell)/2); fy=Math.round(60+((vh-btnH-70)-ROWS*cell)/2); }
  layoutButtons();
}
addEventListener('resize',fit);

/* ---------- pieces ---------- */
function refill(){ const b=['I','O','T','S','Z','J','L']; for(let i=b.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[b[i],b[j]]=[b[j],b[i]];} bag.push(...b); }
function nextPiece(){ while(nextQ.length<4){ if(!bag.length) refill(); nextQ.push(bag.shift()); } return nextQ.shift(); }
function spawn(type){
  type=type||nextPiece();
  cur={t:type,r:0,x:3,y:0,cells:SHAPES[type].map(c=>c.slice())};
  if(type==='I') cur.y=-1; if(type==='O') cur.y=0;
  cur.y += HIDDEN-2;
  if(collides(cur,0,0,cur.cells)){ gameOver(); }
  dropT=0; lockT=0; canHold=true;
}
function rotated(cells,type,dir){
  if(type==='O') return cells.map(c=>c.slice());
  const n=type==='I'?4:3;
  return cells.map(([x,y])=> dir>0 ? [n-1-y,x] : [y,n-1-x]);
}
function collides(p,dx,dy,cells){
  for(const [cx,cy] of cells){ const x=p.x+cx+dx, y=p.y+cy+dy;
    if(x<0||x>=COLS||y>=ROWS+HIDDEN) return true; if(y>=0 && board[y][x]) return true; }
  return false;
}
function tryRotate(dir){
  const cells=rotated(cur.cells,cur.t,dir); const ks = cur.t==='I'?KICKS.i:KICKS.n;
  for(const [kx,ky] of ks){ const sx=kx*dir, sy=-ky; if(!collides(cur,sx,sy,cells)){ cur.cells=cells; cur.x+=sx; cur.y+=sy; cur.r=(cur.r+dir+4)%4; lockT=Math.min(lockT,lockDelay*0.6); return true; } }
  for(const [kx,ky] of ks){ const sx=-kx*dir, sy=ky; if(!collides(cur,sx,sy,cells)){ cur.cells=cells; cur.x+=sx; cur.y+=sy; cur.r=(cur.r+dir+4)%4; return true; } }
  return false;
}
function move(dx){ if(!collides(cur,dx,0,cur.cells)){ cur.x+=dx; lockT=Math.min(lockT,lockDelay*0.6); return true; } return false; }
function ghostY(){ let dy=0; while(!collides(cur,0,dy+1,cur.cells)) dy++; return cur.y+dy; }
function hardDrop(){ const gy=ghostY(); score+=2*(gy-cur.y); cur.y=gy; lock(); shake=4; }
function softDrop(){ if(!collides(cur,0,1,cur.cells)){ cur.y++; score+=1; dropT=0; return true; } return false; }
function doHold(){ if(!canHold) return; const t=cur.t; if(hold){ const h=hold; hold=t; spawn(h); } else { hold=t; spawn(); } canHold=false; }
function lock(){
  for(const [cx,cy] of cur.cells){ const y=cur.y+cy, x=cur.x+cx; if(y>=0) board[y][x]=cur.t; }
  const full=[]; for(let y=0;y<ROWS+HIDDEN;y++) if(board[y].every(v=>v)) full.push(y);
  if(full.length){ flashRows=full; flashT=260; const pts=[0,100,300,500,800][full.length]*level; score+=pts; lines+=full.length;
    if(full.length===4){ tetrisT=900; shake=8; } msg(full.length===4?'VWAB!':'+'+pts, fx+COLS*cell/2, fy+(full[0]-HIDDEN)*cell);
    const nl=1+Math.floor(lines/10); if(nl>level){ level=nl; msg('LEVEL '+level, fx+COLS*cell/2, fy+ROWS*cell*0.4); }
    cur=null; }
  else spawn();
  if(score>best){ best=score; store.best=best; save(); }
}
function clearFlashed(){ flashRows.sort((a,b)=>a-b); for(const y of flashRows){ board.splice(y,1); board.unshift(Array(COLS).fill(null)); } flashRows=[]; spawn(); }
function gravity(){ return Math.max(60, 800*Math.pow(0.82,level-1)); }
function msg(s,x,y){ msgs.push({s,x,y,l:800}); }
function gameOver(){ state='over'; cur=null; store.best=best; save(); }
function newGame(){ board=Array.from({length:ROWS+HIDDEN},()=>Array(COLS).fill(null)); bag=[]; nextQ=[]; hold=null; score=0; lines=0; level=1; flashRows=[]; msgs=[]; tetrisT=0; state='play'; spawn(); }

/* ---------- update ---------- */
function update(dt){
  if(state!=='play') return;
  if(flashRows.length){ flashT-=dt; if(flashT<=0) clearFlashed(); return; }
  if(!cur) return;
  const dropping = keys.soft ? Math.min(gravity(),45) : gravity();
  dropT+=dt;
  if(dropT>=dropping){ dropT=0; if(!collides(cur,0,1,cur.cells)){ cur.y++; if(keys.soft) score+=1; } }
  if(collides(cur,0,1,cur.cells)){ lockT+=dt; if(lockT>=lockDelay) lock(); } else lockT=0;
  // DAS
  if(keys.left||keys.right){ das+=dt; if(das>170){ arr+=dt; if(arr>40){ arr=0; move(keys.left?-1:1); } } } else { das=0; arr=0; }
  for(const m of msgs) m.l-=dt; msgs=msgs.filter(m=>m.l>0);
  if(shake>0) shake-=dt*0.03; if(tetrisT>0) tetrisT-=dt;
}
let keys={}, das=0, arr=0;

/* ---------- input ---------- */
let touch=null;
function layoutButtons(){
  btns=[]; if(land) return;
  const bh=Math.min(90,H*0.12), by=H-bh-10, n=5, bw=Math.min(90,(W-24)/n-6), gap=(W-n*bw)/(n+1);
  const defs=[['◀','left'],['⟲','rot'],['▼','soft'],['▶','right'],['⤓','hard']];
  defs.forEach(([lab,act],i)=>btns.push({x:gap+i*(bw+gap),y:by,w:bw,h:bh,lab,act}));
}
function btnAt(x,y){ return btns.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h); }
function pos(e){ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function press(act){
  if(state!=='play'||!cur) return;
  if(act==='left'){ move(-1); keys.left=true; das=0; } if(act==='right'){ move(1); keys.right=true; das=0; }
  if(act==='rot') tryRotate(1); if(act==='rotl') tryRotate(-1); if(act==='soft') keys.soft=true; if(act==='hard') hardDrop(); if(act==='hold') doHold();
}
function release(act){ if(act==='left') keys.left=false; if(act==='right') keys.right=false; if(act==='soft') keys.soft=false; }
cv.addEventListener('pointerdown',e=>{
  const p=pos(e); try{cv.setPointerCapture(e.pointerId)}catch(_){}
  if(state==='title'||state==='over'){ newGame(); return; }
  if(state==='pause'){ state='play'; return; }
  // pause button (top-right of field)
  if(p.x>W-50 && p.y<50){ state='pause'; return; }
  const b=btnAt(p.x,p.y); if(b){ touch={btn:b.act}; press(b.act); return; }
  // hold box tap
  if(holdBox && p.x>=holdBox.x&&p.x<=holdBox.x+holdBox.w&&p.y>=holdBox.y&&p.y<=holdBox.y+holdBox.h){ doHold(); return; }
  touch={x0:p.x,y0:p.y,x:p.x,y:p.y,t0:performance.now(),moved:false,cells:0};
});
cv.addEventListener('pointermove',e=>{
  if(!touch||touch.btn||!cur||state!=='play') return; const p=pos(e);
  const dx=p.x-touch.x, dy=p.y-touch.y;
  const stepX=cell*0.9;
  if(Math.abs(p.x-touch.x0)>8||Math.abs(p.y-touch.y0)>8) touch.moved=true;
  while(Math.abs(dx)>=stepX && Math.abs(p.x-touch.x0)>Math.abs(p.y-touch.y0)*0.7){ if(move(dx>0?1:-1)) touch.x+= dx>0?stepX:-stepX; else { touch.x=p.x; break; } touch.vert=false; break; }
  if(Math.abs(p.x-touch.x)>=stepX) touch.x=p.x- (dx>0?stepX:-stepX)*0;
  if(dy>=cell*0.8 && Math.abs(p.y-touch.y0)>Math.abs(p.x-touch.x0)){ softDrop(); touch.y=p.y; touch.down=true; }
  if(dy<=-cell*2.5 && !touch.held){ touch.held=true; doHold(); }
});
function endTouch(e){
  if(!touch) return; const tt=touch; touch=null;
  if(tt.btn){ release(tt.btn); return; }
  if(!cur||state!=='play') return;
  const dtm=performance.now()-tt.t0; const p=pos(e);
  if(!tt.moved && dtm<300){ tryRotate(p.x<W/2&&land?-1:1); return; }
  if(tt.down && dtm<220 && (p.y-tt.y0)>cell*3) hardDrop();
}
cv.addEventListener('pointerup',endTouch); cv.addEventListener('pointercancel',endTouch);
addEventListener('keydown',e=>{
  if(e.repeat) return;
  if(state==='title'||state==='over'){ if(e.key==='Enter'||e.key===' '){ newGame(); } return; }
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){ state = state==='play'?'pause':'play'; return; }
  if(state==='pause'){ if(e.key==='Enter'||e.key===' ') state='play'; return; }
  const m={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'soft',ArrowUp:'rot',x:'rot',X:'rot',z:'rotl',Z:'rotl',' ':'hard',c:'hold',C:'hold',Shift:'hold'};
  if(m[e.key]){ e.preventDefault(); press(m[e.key]); }
});
addEventListener('keyup',e=>{ const m={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'soft'}; if(m[e.key]) release(m[e.key]); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='play') state='pause'; });

/* ---------- drawing ---------- */
function neonCell(x,y,s,col,alpha,solid){
  const r=Math.max(1,s*0.12), inset=Math.max(1,s*0.14), lw=Math.max(1.2,s*0.11);
  g.save(); g.globalAlpha=alpha==null?1:alpha;
  g.shadowColor=col; g.shadowBlur=s*0.5; g.strokeStyle=col; g.lineWidth=lw;
  rr(x+inset,y+inset,s-2*inset,s-2*inset,r); g.stroke();
  g.shadowBlur=0; g.fillStyle=col; g.globalAlpha*= solid?0.22:0.08; rr(x+inset,y+inset,s-2*inset,s-2*inset,r); g.fill();
  g.restore();
}
function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function label(s,x,y,size,col,align,font,glow){
  g.font=(font==='anton'?'400 ':'700 ')+size+'px '+(font==='anton'?'Anton':'"Barlow Semi Condensed"')+', Impact, "Arial Narrow", sans-serif';
  g.textAlign=align||'left'; g.textBaseline='top'; g.fillStyle=col; g.shadowColor=col; g.shadowBlur=glow==null?size*0.5:glow; g.fillText(s,x,y); g.shadowBlur=0;
}
function miniPiece(type,x,y,s,alpha){ if(!type) return; const cells=SHAPES[type]; const minx=Math.min(...cells.map(c=>c[0])), maxx=Math.max(...cells.map(c=>c[0])), miny=Math.min(...cells.map(c=>c[1])), maxy=Math.max(...cells.map(c=>c[1]));
  const ox=x-((maxx-minx+1)*s)/2, oy=y-((maxy-miny+1)*s)/2; for(const [cx,cy] of cells) neonCell(ox+(cx-minx)*s,oy+(cy-miny)*s,s,C[type],alpha,true); }
let holdBox=null;
function panel(x,y,w,h){ g.save(); g.strokeStyle='rgba(34,230,255,.35)'; g.lineWidth=1; g.shadowColor=HUD_CYAN; g.shadowBlur=8; rr(x,y,w,h,8); g.stroke(); g.restore(); }
function hud(){
  const s=Math.max(10,cell*0.95), fs=Math.max(9,Math.round(cell*0.7));
  if(land){
    const lx=fx-cell*4.6, rx=fx+COLS*cell+cell*1.2, pw=cell*3.4, ty=fy+cell*0.5;
    panel(lx,ty,pw,cell*4); label('HOLD',lx+pw/2,ty+6,fs,HUD_PINK,'center'); miniPiece(hold,lx+pw/2,ty+cell*2.5,s*0.7,canHold?1:0.4); holdBox={x:lx,y:ty,w:pw,h:cell*4};
    panel(lx,ty+cell*4.6,pw,cell*5.4); label('SCORE',lx+pw/2,ty+cell*4.6+6,fs,HUD_PINK,'center'); label(String(score).padStart(6,'0'),lx+pw/2,ty+cell*4.6+6+fs*1.3,fs*1.3,INK,'center');
    label('LINES',lx+pw/2,ty+cell*4.6+6+fs*3.2,fs,HUD_PINK,'center'); label(lines,lx+pw/2,ty+cell*4.6+6+fs*4.5,fs*1.3,INK,'center');
    panel(lx,ty+cell*10.4,pw,cell*3.4); label('BEST',lx+pw/2,ty+cell*10.4+6,fs,YEL,'center'); label(String(best).padStart(6,'0'),lx+pw/2,ty+cell*10.4+6+fs*1.3,fs*1.3,YEL,'center');
    panel(rx,ty,pw,cell*11); label('NEXT',rx+pw/2,ty+6,fs,HUD_CYAN,'center'); nextQ.slice(0,3).forEach((t,i)=>miniPiece(t,rx+pw/2,ty+cell*2.6+i*cell*3,s*0.7,1-i*0.25));
    panel(rx,ty+cell*11.6,pw,cell*3.4); label('LEVEL',rx+pw/2,ty+cell*11.6+6,fs,HUD_PINK,'center'); label(String(level).padStart(2,'0'),rx+pw/2,ty+cell*11.6+6+fs*1.3,fs*1.3,INK,'center');
    label('VROEGER WAS ALLES BETER',W/2,H-fs*1.6,fs*0.8,'rgba(255,209,0,.5)','center','',0);
  } else {
    const top=fy-56, bw=W/4;
    label('HOLD',bw*0.5,top,fs,HUD_PINK,'center'); miniPiece(hold,bw*0.5,top+34,s*0.55,canHold?1:0.4); holdBox={x:0,y:top-6,w:bw,h:54};
    label('SCORE',bw*1.5,top,fs,HUD_PINK,'center'); label(String(score).padStart(6,'0'),bw*1.5,top+fs*1.3,fs*1.4,INK,'center');
    label('LEVEL '+level,bw*2.5,top,fs,HUD_PINK,'center'); label(lines+' LINES',bw*2.5,top+fs*1.3,fs*1.1,INK,'center');
    label('NEXT',bw*3.5,top,fs,HUD_CYAN,'center'); miniPiece(nextQ[0],bw*3.5,top+34,s*0.55,1);
    label('BEST '+best,W/2,H-Math.min(90,H*0.12)-28,fs*0.9,YEL,'center');
  }
  // pause glyph
  g.save(); g.fillStyle='rgba(223,246,255,.5)'; g.fillRect(W-30,14,5,16); g.fillRect(W-20,14,5,16); g.restore();
}
function field(){
  const w=COLS*cell, h=ROWS*cell;
  g.save(); if(shake>0) g.translate((Math.random()*shake-shake/2),(Math.random()*shake-shake/2));
  g.fillStyle='#02050c'; g.fillRect(fx,fy,w,h);
  g.strokeStyle=GRID; g.lineWidth=1; g.beginPath(); for(let i=0;i<=COLS;i++){ g.moveTo(fx+i*cell+.5,fy); g.lineTo(fx+i*cell+.5,fy+h); } for(let j=0;j<=ROWS;j++){ g.moveTo(fx,fy+j*cell+.5); g.lineTo(fx+w,fy+j*cell+.5); } g.stroke();
  g.save(); g.strokeStyle=tetrisT>0?YEL:'rgba(34,230,255,.7)'; g.lineWidth=2; g.shadowColor=tetrisT>0?YEL:HUD_CYAN; g.shadowBlur=tetrisT>0?30:14; rr(fx-3,fy-3,w+6,h+6,8); g.stroke(); g.restore();
  for(let y=HIDDEN;y<ROWS+HIDDEN;y++) for(let x=0;x<COLS;x++){ const v=board[y][x]; if(!v) continue;
    const fl=flashRows.includes(y); neonCell(fx+x*cell,fy+(y-HIDDEN)*cell,cell, fl?'#ffffff':C[v], fl?(0.5+0.5*Math.sin(flashT*0.05)):1, true); }
  if(cur){ const gy=ghostY(); for(const [cx,cy] of cur.cells){ const y=gy+cy-HIDDEN; if(y>=0) neonCell(fx+(cur.x+cx)*cell,fy+y*cell,cell,C[cur.t],0.28,false); }
    for(const [cx,cy] of cur.cells){ const y=cur.y+cy-HIDDEN; if(y>=0) neonCell(fx+(cur.x+cx)*cell,fy+y*cell,cell,C[cur.t],1,true); } }
  for(const m of msgs){ label(m.s,m.x,m.y-(800-m.l)*0.03,Math.max(14,cell*1.1),m.s==='VWAB!'?YEL:INK,'center','anton'); }
  g.restore();
}
function buttons(){
  for(const b of btns){ g.save(); g.strokeStyle= (touch&&touch.btn===b.act)?YEL:'rgba(34,230,255,.5)'; g.lineWidth=1.5; g.shadowColor=g.strokeStyle; g.shadowBlur=10; rr(b.x,b.y,b.w,b.h,10); g.stroke();
    g.fillStyle=(touch&&touch.btn===b.act)?YEL:INK; g.font='400 '+Math.round(b.h*0.42)+'px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.shadowBlur=0; g.fillText(b.lab,b.x+b.w/2,b.y+b.h/2); g.restore(); }
}
/* title: V W A B in discs */
const LET={V:['10001','10001','10001','01010','00100'],W:['10001','10001','10101','10101','01010'],A:['01110','10001','11111','10001','10001'],B:['11110','10001','11110','10001','11110']};
function disc(cx,cy,r,col,letter,t){
  g.save(); g.strokeStyle=col; g.lineWidth=2; g.shadowColor=col; g.shadowBlur=18; g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.stroke();
  g.shadowBlur=0; g.strokeStyle='rgba(34,230,255,.12)'; g.lineWidth=1; g.beginPath(); g.arc(cx,cy,r*0.86,0,Math.PI*2); g.clip();
  const s=r*0.26, rows=LET[letter], ox=cx-2.5*s, oy=cy-2.5*s;
  for(let i=-6;i<6;i++){ g.moveTo(cx+i*s,cy-r); g.lineTo(cx+i*s,cy+r); g.moveTo(cx-r,cy+i*s); g.lineTo(cx+r,cy+i*s); } g.stroke();
  rows.forEach((row,ry)=>[...row].forEach((v,rx)=>{ if(v==='1') neonCell(ox+rx*s,oy+ry*s,s,col,0.85+0.15*Math.sin(t*0.004+rx+ry),true); }));
  g.restore();
}
function title(t){
  const n=4, r=Math.min(W/(n*2.4), H*0.14), cx0=W/2-(n-1)*r*1.15, cy=land?H*0.42:H*0.36;
  [['V',C.I],['W',C.T],['A',C.O],['B',C.S]].forEach(([l,c],i)=>disc(cx0+i*r*2.3,cy,r,c,l,t));
  label('BLOK-INATOR',W/2,cy+r*1.5,Math.min(56,W*0.12),YEL,'center','anton');
  label('VROEGER WAS ALLES BETER',W/2,cy+r*1.5+Math.min(56,W*0.12)*1.15,Math.min(16,W*0.04),HUD_CYAN,'center');
  if(Math.sin(t*0.005)>0) label('TIK OM TE STARTEN',W/2,H*0.78,Math.min(22,W*0.05),INK,'center');
  label('BEST '+best,W/2,H*0.78+30,Math.min(14,W*0.035),YEL,'center');
  label('LEDJOCKEY',W/2,H-30,12,'rgba(223,246,255,.5)','center','',0);
}
function veil(){ g.fillStyle='rgba(0,0,0,.72)'; g.fillRect(0,0,W,H); }
function draw(t){
  g.fillStyle='#000'; g.fillRect(0,0,W,H);
  if(state==='title'){ title(t); return; }
  field(); hud(); buttons();
  if(state==='pause'){ veil(); label('PAUZE',W/2,H*0.42,Math.min(56,W*0.12),YEL,'center','anton'); label('TIK OM VERDER TE GAAN',W/2,H*0.42+70,16,INK,'center'); }
  if(state==='over'){ veil(); label('GAME OVER',W/2,H*0.36,Math.min(56,W*0.12),HUD_PINK,'center','anton'); label('SCORE '+score,W/2,H*0.36+70,22,INK,'center'); label(lines+' LINES · LEVEL '+level,W/2,H*0.36+100,16,HUD_CYAN,'center'); label(score>=best&&score>0?'NIEUW RECORD!':'BEST '+best,W/2,H*0.36+130,18,YEL,'center'); label('TIK VOOR NIEUW SPEL',W/2,H*0.36+170,16,INK,'center'); }
}
function frame(t){ const dt=Math.min(50,t-t_last||16); t_last=t; update(dt); draw(t); requestAnimationFrame(frame); }
board=Array.from({length:ROWS+HIDDEN},()=>Array(COLS).fill(null));
fit(); requestAnimationFrame(frame);
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body>
